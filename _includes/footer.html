{% include base_path %}

<p class="reference-sitemap"><a href="{{ base_path }}/sitemap.xml">Sitemap</a></p>
<div class="page__footer-follow">
  <ul class="social-icons">
    <li><strong>Follow:</strong></li>
    {% if site.author.github %}<li><a href="https://github.com/{{ site.author.github }}"><i class="fab fa-github" aria-hidden="true"></i> GitHub</a></li>{% endif %}
    {% if site.author.linkedin %}<li><a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/"><i class="fab fa-linkedin" aria-hidden="true"></i> LinkedIn</a></li>{% endif %}
  </ul>
</div>
<div class="page__footer-copyright">
  &copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}. Powered by <a href="https://jekyllrb.com/">Jekyll</a> &amp; <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a>.
</div>
